spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoints.web.exposure.include=health
spring.web.error.include-message=never
server.forward-headers-strategy=none
spring.session.jdbc.initialize-schema=never
spring.session.timeout=4h
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
cre.guest.lifetime=4h
cre.guest.hourly-limit=50
cre.guest.purge-interval=5m
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-5.6-luna}
spring.ai.openai.chat.timeout=10s
spring.ai.openai.max-retries=0
spring.ai.retry.max-attempts=1
spring.ai.openai.chat.max-completion-tokens=512
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
cre.suggestions.workspace-limit=10
cre.suggestions.daily-limit=100
cre.suggestions.max-text-length=500
