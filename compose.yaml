name: configuration-rule-engine

services:
  db:
    image: postgres:18.6
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cre
      POSTGRES_USER: cre
      POSTGRES_PASSWORD: >-
        ${CRE_DB_PASSWORD:?Set CRE_DB_PASSWORD in a local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - data

  app:
    build:
      context: .
      args:
        PRIMEUI_LICENSE_KEY: ${PRIMEUI_LICENSE_KEY:-}
    user: "10001:10001"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cre
      DATABASE_USER: cre
      DATABASE_PASSWORD: >-
        ${CRE_DB_PASSWORD:?Set CRE_DB_PASSWORD in a local .env file}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "127.0.0.1:${CRE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - default
      - data

  # Runs only with the public profile (COMPOSE_PROFILES=public). An existing Cloudflare Tunnel and
  # its reverse proxy reach it as cre-proxy:8080 on the shared ingress network.
  cre-proxy:
    image: caddy:2.11.4-alpine
    profiles:
      - public
    user: "10002:10002"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The image's own /config and /data belong to root.
      XDG_CONFIG_HOME: /tmp/caddy
      XDG_DATA_HOME: /tmp/caddy
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${CRE_PROXY_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - default
      - ingress

networks:
  # No internet access; only the app reaches the database.
  data:
    internal: true
  # The existing Docker network of the tunnel's reverse proxy.
  ingress:
    external: true
    name: ${CRE_INGRESS_NETWORK:-cre_ingress}

volumes:
  postgres_data:
