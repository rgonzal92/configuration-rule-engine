name: configuration-rule-engine

services:
  db:
    image: postgres:18.6
    user: postgres
    environment:
      POSTGRES_DB: cre
      POSTGRES_USER: cre
      POSTGRES_PASSWORD: >-
        ${CRE_DB_PASSWORD:?Set CRE_DB_PASSWORD in a local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    user: "10001:10001"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cre
      DATABASE_USER: cre
      DATABASE_PASSWORD: >-
        ${CRE_DB_PASSWORD:?Set CRE_DB_PASSWORD in a local .env file}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "127.0.0.1:${CRE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
